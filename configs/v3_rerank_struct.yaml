# V3 = V2 + reranker tuyến tính với đặc trưng namespace, ký hiệu, file/thư mục, loại khai báo.
# Không dùng thống kê phụ thuộc (popularity/PageRank) và không lọc truy cập được.
name: V3
index: {fields: [name, namespace, statement], tokenizer: lean, codec: vb}
search:
  k1: 3.0
  b: {name: 1.0, namespace: 1.0, statement: 1.0}
  weights: {name: 1.0, namespace: 0.5, statement: 1.0}
  query_tf: binary
rerank:
  candidates: 100
  accessible_filter: false
  strategy: random
  features: [bm25_rel, bm25_rr, ns_in_query, ns_thm, same_file, dir_overlap, sym_jaccard, kind_thm, kind_def, kind_inst, kind_type]
  model: results/models/v3.json
