# Ablation: V4 bỏ PageRank, giữ popularity.
index:
  codec: vb
  fields:
  - name
  - namespace
  - statement
  tokenizer: lean
name: V4-poponly
rerank:
  accessible_filter: true
  candidates: 100
  features:
  - bm25_rel
  - bm25_rr
  - ns_in_query
  - ns_thm
  - same_file
  - dir_overlap
  - sym_jaccard
  - kind_thm
  - kind_def
  - kind_inst
  - kind_type
  - popularity
  model: results/models/review/v4_poponly.json
  strategy: random
search:
  b:
    name: 1.0
    namespace: 1.0
    statement: 1.0
  k1: 3.0
  query_tf: binary
  weights:
    name: 1.0
    namespace: 0.5
    statement: 1.0
