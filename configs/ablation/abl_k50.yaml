# Sinh bởi scripts/ablation.py
name: abl_k50
index:
  fields:
  - name
  - namespace
  - statement
  tokenizer: lean
  codec: vb
search:
  k1: 3.0
  b:
    name: 1.0
    namespace: 1.0
    statement: 1.0
  weights:
    name: 1.0
    namespace: 0.5
    statement: 1.0
  query_tf: binary
rerank:
  candidates: 50
  accessible_filter: true
  strategy: random
  features:
  - bm25_rel
  - bm25_rr
  - ns_in_query
  - ns_thm
  - same_file
  - dir_overlap
  - sym_jaccard
  - kind_thm
  - kind_def
  - kind_inst
  - kind_type
  - popularity
  - pagerank
  model: results/models/ablation/abl_k50.json
